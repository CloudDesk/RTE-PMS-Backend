name: Deploy PROD PMS Backend to Azure Container Apps

on:
  push:
    branches:
      - PROD
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: RTE
  AZURE_CONTAINER_REGISTRY_NAME: acrrtepmsprod
  AZURE_CONTAINER_APP_NAME: rte-pms-prod
  IMAGE_NAME: rte-pms-backend

concurrency:
  group: azure-container-app-pms-prod
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Build and deploy PMS backend
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set image names
        run: |
          login_server="${AZURE_CONTAINER_REGISTRY_NAME}.azurecr.io"
          echo "ACR_LOGIN_SERVER=$login_server" >> "$GITHUB_ENV"
          echo "IMAGE_SHA=$login_server/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_PROD=$login_server/${IMAGE_NAME}:prod" >> "$GITHUB_ENV"

      - name: Login to Azure Container Registry
        run: az acr login --name "$AZURE_CONTAINER_REGISTRY_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push PMS backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_SHA }}
            ${{ env.IMAGE_PROD }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs the one-shot migrations and builds schema indexes once, from the
      # freshly built production image, before the new revision serves traffic.
      # The API no longer does this at boot: doing it per replica meant every
      # scale-out fired DDL and updateMany at the database under peak load.
      - name: Run database migrations and index sync
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          docker pull "$IMAGE_SHA"
          docker run --rm \
            -e MONGODB_URI \
            -e NODE_ENV=production \
            -e DB_MAX_POOL_SIZE=1 \
            -e DB_MIN_POOL_SIZE=0 \
            -e DB_MAX_IDLE_TIME_MS=60000 \
            -e DB_SOCKET_TIMEOUT_MS=120000 \
            -e DB_WAIT_QUEUE_TIMEOUT_MS=20000 \
            -e DB_MAX_CONNECTING=1 \
            -e DB_RETRY_READS=true \
            -e DB_APP_NAME=rte-pms-migrations \
            -e DB_AUTO_INDEX=false \
            -e DB_INDEX_BUILD_MAX_ATTEMPTS=3 \
            -e DB_INDEX_BUILD_RETRY_DELAY_MS=5000 \
            "$IMAGE_SHA" \
            npm run db:migrate:startup:built

      - name: Update Container App image
        run: |
          az containerapp update \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE_SHA" \
            --set-env-vars \
              NODE_ENV=production \
              DB_MAX_POOL_SIZE=6 \
              DB_MIN_POOL_SIZE=2 \
              DB_MAX_IDLE_TIME_MS=60000 \
              DB_SOCKET_TIMEOUT_MS=120000 \
              DB_WAIT_QUEUE_TIMEOUT_MS=20000 \
              DB_MAX_CONNECTING=2 \
              DB_RETRY_READS=true \
              DB_APP_NAME=rte-pms-backend \
              DB_AUTO_INDEX=false \
              PMS_STORAGE_PROVIDER=azure \
              PMS_AZURE_STORAGE_ACCOUNT=rteintranetfiles \
              PMS_AZURE_STORAGE_CONTAINER=pms

      - name: Resolve Container App URL
        run: |
          fqdn="$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)"

          if [ -z "$fqdn" ]; then
            echo "Container App ingress FQDN was not found."
            exit 1
          fi

          echo "APP_URL=https://$fqdn" >> "$GITHUB_ENV"

      - name: Verify PMS backend health
        run: |
          for endpoint in health/live health/ready; do
            echo "Checking $APP_URL/$endpoint"

            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "$APP_URL/$endpoint"; then
                echo
                echo "$endpoint health check passed."
                break
              fi

              if [ "$attempt" -eq 30 ]; then
                echo "$endpoint health check failed."
                exit 1
              fi

              echo "$endpoint is not healthy yet. Attempt $attempt/30."
              sleep 10
            done
          done
